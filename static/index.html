<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uncensored AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #212121;
      --sidebar-bg: #171717;
      --surface: #2f2f2f;
      --surface-hover: #3a3a3a;
      --border: #3f3f3f;
      --text: #ececec;
      --text-muted: #8e8ea0;
      --accent: #19c37d;
      --accent-hover: #15a86a;
      --user-bubble: #2f2f2f;
      --assistant-bubble: transparent;
      --input-bg: #2f2f2f;
      --scrollbar: #4a4a4a;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px 12px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #new-chat-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    #new-chat-btn:hover { background: var(--surface-hover); }
    #new-chat-btn svg { flex-shrink: 0; }

    #conversations {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .conv-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, color 0.15s;
    }
    .conv-item:hover { background: var(--surface-hover); color: var(--text); }
    .conv-item.active { background: var(--surface); color: var(--text); }

    #sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    #model-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    #model-select:focus { outline: none; border-color: var(--accent); }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #chat-title { font-weight: 500; color: var(--text); font-size: 15px; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .message {
      max-width: 740px;
      margin: 0 auto;
      padding: 8px 20px;
      display: flex;
      gap: 14px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .message.user { justify-content: flex-end; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar.assistant { background: var(--accent); color: #fff; }
    .avatar.user { background: #7c5cbf; color: #fff; }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 15px;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--border);
      border-radius: 18px 18px 4px 18px;
    }
    .message.assistant .bubble {
      background: var(--assistant-bubble);
    }

    .bubble pre {
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
    }
    .bubble code { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 13px; }
    .bubble p:not(:last-child) { margin-bottom: 8px; }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent);
      border-radius: 1px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text-muted);
    }
    #empty-state h2 { color: var(--text); font-size: 22px; font-weight: 600; }
    #empty-state p { font-size: 14px; max-width: 340px; text-align: center; }

    /* ── Input ── */
    #input-area {
      padding: 12px 20px 20px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    #input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }
    #input-wrapper:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      max-height: 200px;
      min-height: 24px;
      line-height: 1.5;
      font-family: inherit;
    }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn svg { color: #fff; }

    #stop-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    #stop-btn:hover { background: var(--surface-hover); }
    #stop-btn.visible { display: flex; }

    #footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-header">
    <button id="new-chat-btn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New chat
    </button>
  </div>
  <div id="conversations"></div>
  <div id="sidebar-footer">
    <div style="margin-bottom:4px;font-weight:500;color:var(--text)">Model</div>
    <select id="model-select">
      <option value="dolphin-phi">dolphin-phi (loading…)</option>
    </select>
  </div>
</nav>

<!-- Main -->
<main id="main">
  <div id="chat-header">
    <span id="chat-title">Uncensored AI</span>
    <span id="status-indicator" style="font-size:12px"></span>
  </div>

  <div id="messages">
    <div id="empty-state">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" opacity="0.4">
        <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <h2>Uncensored AI</h2>
      <p>Ask anything. Powered by <strong>dolphin-phi</strong> via Ollama — no filters.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrapper">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Message Uncensored AI…"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button id="send-btn" title="Send">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div style="display:flex;justify-content:center;margin-top:8px">
      <button id="stop-btn">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        Stop generating
      </button>
    </div>
    <div id="footer-note">Responses may contain unfiltered content.</div>
  </div>
</main>

<script>
  // ── State ──
  let conversations = JSON.parse(localStorage.getItem('conversations') || '[]');
  let activeId = null;
  let controller = null; // AbortController for streaming

  // ── DOM refs ──
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');
  const modelSelect = document.getElementById('model-select');
  const convsEl = document.getElementById('conversations');
  const chatTitle = document.getElementById('chat-title');
  const statusEl = document.getElementById('status-indicator');

  // ── Model loading ──
  async function loadModels() {
    try {
      const res = await fetch('/api/models');
      const data = await res.json();
      if (data.models && data.models.length > 0) {
        modelSelect.innerHTML = '';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          modelSelect.appendChild(opt);
        });
        statusEl.textContent = `${data.models.length} model(s) available`;
        statusEl.style.color = 'var(--accent)';
      } else {
        statusEl.textContent = 'No models found — run: ollama pull dolphin-mistral';
        statusEl.style.color = '#e87070';
      }
    } catch {
      statusEl.textContent = 'Ollama not running — run: ollama serve';
      statusEl.style.color = '#e87070';
    }
  }

  // ── Conversation management ──
  function getConv(id) {
    return conversations.find(c => c.id === id);
  }

  function saveConversations() {
    localStorage.setItem('conversations', JSON.stringify(conversations));
  }

  function newConversation() {
    const id = Date.now().toString();
    conversations.unshift({ id, title: 'New chat', messages: [] });
    saveConversations();
    setActive(id);
    renderSidebar();
  }

  function setActive(id) {
    activeId = id;
    renderMessages();
    renderSidebar();
    const conv = getConv(id);
    chatTitle.textContent = conv ? conv.title : 'Uncensored AI';
  }

  function renderSidebar() {
    convsEl.innerHTML = '';
    conversations.forEach(c => {
      const el = document.createElement('div');
      el.className = 'conv-item' + (c.id === activeId ? ' active' : '');
      el.textContent = c.title;
      el.onclick = () => setActive(c.id);
      convsEl.appendChild(el);
    });
  }

  // ── Message rendering ──
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMarkdown(text) {
    // Basic markdown: code blocks, inline code, bold, italic, newlines
    let html = escapeHtml(text);

    // Fenced code blocks
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code class="language-${lang}">${code.trimEnd()}</code></pre>`
    );
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Newlines → <br> (only outside pre blocks)
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  function createMessageEl(role, content) {
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'user' ? 'U' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(content);

    if (role === 'user') {
      msg.appendChild(bubble);
      msg.appendChild(avatar);
    } else {
      msg.appendChild(avatar);
      msg.appendChild(bubble);
    }
    return msg;
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    const conv = getConv(activeId);
    if (!conv || conv.messages.length === 0) {
      messagesEl.appendChild(emptyState);
      return;
    }
    conv.messages.forEach(m => {
      messagesEl.appendChild(createMessageEl(m.role, m.content));
    });
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send message ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !activeId) return;

    const conv = getConv(activeId);
    if (!conv) return;

    // Add user message
    conv.messages.push({ role: 'user', content: text });
    if (conv.title === 'New chat') {
      conv.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
      chatTitle.textContent = conv.title;
    }
    saveConversations();
    renderSidebar();

    inputEl.value = '';
    resizeTextarea();
    renderMessages();

    // Add assistant placeholder
    const assistantMsg = { role: 'assistant', content: '' };
    conv.messages.push(assistantMsg);
    const msgEl = createMessageEl('assistant', '');
    const bubble = msgEl.querySelector('.bubble');

    // Add blinking cursor
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);
    messagesEl.appendChild(msgEl);
    scrollToBottom();

    sendBtn.disabled = true;
    stopBtn.classList.add('visible');

    controller = new AbortController();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: conv.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
        }),
        signal: controller.signal,
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullContent = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') break;

          try {
            const data = JSON.parse(payload);
            if (data.error) {
              fullContent += `\n⚠️ ${data.error}`;
            } else if (data.content) {
              fullContent += data.content;
            }
            // Re-render with cursor
            bubble.innerHTML = renderMarkdown(fullContent);
            bubble.appendChild(cursor);
            scrollToBottom();
          } catch {}
        }
      }

      // Finalize
      bubble.innerHTML = renderMarkdown(fullContent);
      assistantMsg.content = fullContent;
      saveConversations();
    } catch (err) {
      if (err.name !== 'AbortError') {
        bubble.innerHTML = renderMarkdown('⚠️ Connection error. Make sure Ollama is running: `ollama serve`');
      }
    } finally {
      sendBtn.disabled = false;
      stopBtn.classList.remove('visible');
      controller = null;
    }
  }

  // ── Auto-resize textarea ──
  function resizeTextarea() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
  }

  // ── Event listeners ──
  document.getElementById('new-chat-btn').addEventListener('click', newConversation);

  sendBtn.addEventListener('click', sendMessage);

  stopBtn.addEventListener('click', () => {
    if (controller) controller.abort();
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', resizeTextarea);

  // ── Init ──
  loadModels();

  if (conversations.length === 0) {
    newConversation();
  } else {
    setActive(conversations[0].id);
    renderSidebar();
  }
</script>
</body>
</html>
